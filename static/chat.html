<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Support Chat - EchoNotify</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }

            .chat-container {
                background: white;
                border-radius: 15px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
                width: 100%;
                max-width: 800px;
                height: 600px;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .chat-header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .chat-header h2 {
                font-size: 1.5rem;
                font-weight: 600;
            }

            .connection-status {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 0.9rem;
            }

            .status-indicator {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #ff4444;
                animation: pulse 2s infinite;
            }

            .status-indicator.connected {
                background: #00ff88;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }

            .login-section {
                padding: 40px;
                display: flex;
                flex-direction: column;
                gap: 20px;
                align-items: center;
                justify-content: center;
                height: 100%;
            }

            .login-section h3 {
                color: #333;
                margin-bottom: 10px;
            }

            .input-group {
                width: 100%;
                max-width: 400px;
            }

            .input-group label {
                display: block;
                margin-bottom: 8px;
                color: #555;
                font-weight: 500;
            }

            .input-group input {
                width: 100%;
                padding: 12px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 1rem;
                transition: border-color 0.3s;
            }

            .input-group input:focus {
                outline: none;
                border-color: #667eea;
            }

            .checkbox-group {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 10px;
            }

            .checkbox-group input[type="checkbox"] {
                width: auto;
            }

            .btn {
                padding: 12px 30px;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
            }

            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            }

            .btn-primary:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

            .messages-container {
                flex: 1;
                padding: 20px;
                overflow-y: auto;
                background: #f8f9fa;
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            .message {
                display: flex;
                gap: 10px;
                animation: slideIn 0.3s ease-out;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .message.own {
                flex-direction: row-reverse;
            }

            .message-avatar {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: 600;
                font-size: 0.9rem;
                flex-shrink: 0;
            }

            .message.support .message-avatar {
                background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            }

            .message-content {
                max-width: 70%;
            }

            .message-bubble {
                padding: 12px 16px;
                border-radius: 15px;
                background: white;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                word-wrap: break-word;
            }

            .message.own .message-bubble {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }

            .message.support .message-bubble {
                background: #fff;
                border: 2px solid #f093fb;
            }

            .message-meta {
                display: flex;
                gap: 10px;
                margin-top: 5px;
                font-size: 0.75rem;
                color: #888;
                padding: 0 5px;
            }

            .message.own .message-meta {
                justify-content: flex-end;
            }

            .typing-indicator {
                display: flex;
                gap: 4px;
                padding: 10px;
            }

            .typing-indicator span {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #667eea;
                animation: typing 1.4s infinite;
            }

            .typing-indicator span:nth-child(2) {
                animation-delay: 0.2s;
            }

            .typing-indicator span:nth-child(3) {
                animation-delay: 0.4s;
            }

            @keyframes typing {
                0%,
                60%,
                100% {
                    transform: translateY(0);
                }
                30% {
                    transform: translateY(-10px);
                }
            }

            .message-input-container {
                padding: 20px;
                background: white;
                border-top: 1px solid #e0e0e0;
                display: flex;
                gap: 10px;
                align-items: center;
            }

            .message-input {
                flex: 1;
                padding: 12px 16px;
                border: 2px solid #e0e0e0;
                border-radius: 25px;
                font-size: 1rem;
                font-family: inherit;
                resize: none;
                max-height: 100px;
                transition: border-color 0.3s;
            }

            .message-input:focus {
                outline: none;
                border-color: #667eea;
            }

            .send-button {
                width: 50px;
                height: 50px;
                border-radius: 50%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                color: white;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s;
                flex-shrink: 0;
            }

            .send-button:hover {
                transform: scale(1.1);
            }

            .send-button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
            }

            .notification {
                position: fixed;
                top: 20px;
                right: 20px;
                background: white;
                padding: 15px 20px;
                border-radius: 8px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
                animation: slideInRight 0.3s ease-out;
                z-index: 1000;
            }

            @keyframes slideInRight {
                from {
                    transform: translateX(400px);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }

            .notification.error {
                background: #ff4444;
                color: white;
            }

            .notification.success {
                background: #00ff88;
                color: #333;
            }

            .hidden {
                display: none !important;
            }

            .room-info {
                padding: 10px 20px;
                background: #f0f0f0;
                border-bottom: 1px solid #e0e0e0;
                font-size: 0.9rem;
                color: #666;
            }

            /* Scrollbar styling */
            .messages-container::-webkit-scrollbar {
                width: 8px;
            }

            .messages-container::-webkit-scrollbar-track {
                background: #f1f1f1;
            }

            .messages-container::-webkit-scrollbar-thumb {
                background: #888;
                border-radius: 4px;
            }

            .messages-container::-webkit-scrollbar-thumb:hover {
                background: #555;
            }

            @media (max-width: 600px) {
                .chat-container {
                    height: 100vh;
                    max-width: 100%;
                    border-radius: 0;
                }

                .message-content {
                    max-width: 85%;
                }
            }
        </style>
    </head>
    <body>
        <div class="chat-container">
            <div class="chat-header">
                <h2>Support Chat</h2>
                <div class="connection-status">
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span id="statusText">Disconnected</span>
                </div>
            </div>

            <!-- Login Section -->
            <div id="loginSection" class="login-section">
                <h3>Connect to Chat</h3>
                <div class="input-group">
                    <label for="tokenInput">Access Token</label>
                    <input
                        type="text"
                        id="tokenInput"
                        placeholder="Enter your JWT token"
                    />
                </div>
                <div class="input-group">
                    <label for="roomInput">Room ID (optional)</label>
                    <input
                        type="text"
                        id="roomInput"
                        placeholder="Leave empty for private room"
                    />
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="supportMode" />
                    <label for="supportMode">Connect as Support Staff</label>
                </div>
                <button class="btn btn-primary" id="connectButton">
                    Connect
                </button>
            </div>

            <!-- Chat Section -->
            <div id="chatSection" class="hidden">
                <div id="roomInfo" class="room-info hidden"></div>
                <div class="messages-container" id="messagesContainer">
                    <!-- Messages will be inserted here -->
                </div>
                <div class="message-input-container">
                    <textarea
                        class="message-input"
                        id="messageInput"
                        placeholder="Type your message..."
                        rows="1"
                    ></textarea>
                    <button class="send-button" id="sendButton" disabled>
                        <svg
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <script>
            class ChatApp {
                constructor() {
                    this.ws = null;
                    this.token = null;
                    this.isSupport = false;
                    this.roomId = null;
                    this.currentRoomId = null;
                    this.userId = null;
                    this.typingTimeout = null;

                    this.initElements();
                    this.attachEventListeners();
                }

                initElements() {
                    this.loginSection = document.getElementById("loginSection");
                    this.chatSection = document.getElementById("chatSection");
                    this.tokenInput = document.getElementById("tokenInput");
                    this.roomInput = document.getElementById("roomInput");
                    this.supportMode = document.getElementById("supportMode");
                    this.connectButton =
                        document.getElementById("connectButton");
                    this.messagesContainer =
                        document.getElementById("messagesContainer");
                    this.messageInput = document.getElementById("messageInput");
                    this.sendButton = document.getElementById("sendButton");
                    this.statusIndicator =
                        document.getElementById("statusIndicator");
                    this.statusText = document.getElementById("statusText");
                    this.roomInfo = document.getElementById("roomInfo");
                }

                attachEventListeners() {
                    this.connectButton.addEventListener("click", () =>
                        this.connect(),
                    );
                    this.sendButton.addEventListener("click", () =>
                        this.sendMessage(),
                    );
                    this.messageInput.addEventListener("keypress", (e) => {
                        if (e.key === "Enter" && !e.shiftKey) {
                            e.preventDefault();
                            this.sendMessage();
                        }
                    });
                    this.messageInput.addEventListener("input", () =>
                        this.handleTyping(),
                    );
                }

                connect() {
                    this.token = this.tokenInput.value.trim();
                    this.isSupport = this.supportMode.checked;
                    this.roomId = this.roomInput.value.trim() || null;

                    if (!this.token) {
                        this.showNotification(
                            "Please enter your access token",
                            "error",
                        );
                        return;
                    }

                    this.connectButton.disabled = true;
                    this.connectButton.textContent = "Connecting...";

                    // Change to your WebSocket URL
                    const wsProtocol =
                        window.location.protocol === "https:" ? "wss:" : "ws:";
                    const wsHost = window.location.host || "localhost:8000";
                    const wsUrl = `${wsProtocol}//${wsHost}/chat/ws?token=${this.token}&is_support=${this.isSupport}`;

                    this.ws = new WebSocket(wsUrl);

                    this.ws.onopen = () => this.onOpen();
                    this.ws.onmessage = (event) => this.onMessage(event);
                    this.ws.onclose = () => this.onClose();
                    this.ws.onerror = (error) => this.onError(error);
                }

                onOpen() {
                    console.log("WebSocket connected");
                    this.updateStatus(true);
                    this.loginSection.classList.add("hidden");
                    this.chatSection.classList.remove("hidden");
                    this.sendButton.disabled = false;
                    this.showNotification("Connected to chat", "success");
                }

                onMessage(event) {
                    try {
                        const data = JSON.parse(event.data);
                        console.log("Received message:", data);

                        if (data.type === "auth") {
                            this.userId = data.user_id;
                            console.log("User authenticated:", this.userId);
                        } else if (data.type === "history") {
                            this.currentRoomId = data.room_id;
                            const messages = data.messages;
                            this.roomId = data.room_id;
                            this.updateRoomInfo();
                            messages.forEach((msg) =>
                                this.displayMessage(msg, false),
                            );

                onMessage(event) {
                    try {
                        const data = JSON.parse(event.data);
                        console.log("Received message:", data);

                        if (data.type === "history") {
                            // Load chat history
                            const messages = JSON.parse(data.message);
                            this.roomId = data.room_id;
                            this.updateRoomInfo();
                            messages.forEach((msg) =>
                                this.displayMessage(msg, false),
                            );
                        } else if (data.type === "message") {
                            this.roomId = data.room_id;
                            this.displayMessage(data);
                        } else if (data.type === "notification") {
                            this.showNotification(data.message, "success");
                        } else if (data.type === "typing") {
                            this.showTypingIndicator(data.sender_name);
                        }
                    } catch (error) {
                        console.error("Error parsing message:", error);
                    }
                }

                onClose() {
                    console.log("WebSocket disconnected");
                    this.updateStatus(false);
                    this.sendButton.disabled = true;
                    this.connectButton.disabled = false;
                    this.connectButton.textContent = "Connect";
                    this.showNotification("Disconnected from chat", "error");
                }

                onError(error) {
                    console.error("WebSocket error:", error);
                    this.showNotification("Connection error occurred", "error");
                }

                sendMessage() {
                    const message = this.messageInput.value.trim();
                    if (
                        !message ||
                        !this.ws ||
                        this.ws.readyState !== WebSocket.OPEN
                    ) {
                        return;
                    }

                    const messageData = {
                        type: "message",
                        message: message,
                        room_id: this.roomId || this.currentRoomId,
                    };

                    this.ws.send(JSON.stringify(messageData));
                    this.messageInput.value = "";
                    this.autoResizeTextarea();
                }

                displayMessage(data, animate = true) {
                    const messageDiv = document.createElement("div");
                    messageDiv.className = "message";

                    // Determine if message is from current user
                    const isOwn =
                        data.sender_id === this.userId;
                    const isSupport = data.sender_role === "support";

                    if (isOwn) {
                        messageDiv.classList.add("own");
                    } else if (isSupport) {
                        messageDiv.classList.add("support");
                    }

                    const avatar = document.createElement("div");
                    avatar.className = "message-avatar";
                    avatar.textContent = data.sender_name
                        ? data.sender_name.charAt(0).toUpperCase()
                        : "U";

                    const contentDiv = document.createElement("div");
                    contentDiv.className = "message-content";

                    const bubble = document.createElement("div");
                    bubble.className = "message-bubble";
                    bubble.textContent = data.message;

                    const meta = document.createElement("div");
                    meta.className = "message-meta";

                    const senderName = document.createElement("span");
                    senderName.textContent = data.sender_name || "User";

                    const timestamp = document.createElement("span");
                    const date = new Date(data.created_at || data.timestamp);
                    timestamp.textContent = date.toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit",
                    });

                    meta.appendChild(senderName);
                    meta.appendChild(timestamp);

                    contentDiv.appendChild(bubble);
                    contentDiv.appendChild(meta);

                    messageDiv.appendChild(avatar);
                    messageDiv.appendChild(contentDiv);

                    this.messagesContainer.appendChild(messageDiv);
                    this.scrollToBottom();
                }

                showTypingIndicator(senderName) {
                    // Remove existing typing indicator
                    const existing = document.getElementById("typingIndicator");
                    if (existing) {
                        existing.remove();
                    }

                    const typingDiv = document.createElement("div");
                    typingDiv.id = "typingIndicator";
                    typingDiv.className = "message";
                    typingDiv.innerHTML = `
                    <div class="message-avatar">
                        ${senderName.charAt(0).toUpperCase()}
                    </div>
                    <div class="message-content">
                        <div class="message-bubble">
                            <div class="typing-indicator">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </div>
                    </div>
                `;

                    this.messagesContainer.appendChild(typingDiv);
                    this.scrollToBottom();

                    // Remove after 3 seconds
                    setTimeout(() => {
                        const indicator =
                            document.getElementById("typingIndicator");
                        if (indicator) {
                            indicator.remove();
                        }
                    }, 3000);
                }

                handleTyping() {
                    this.autoResizeTextarea();

                    if (
                        !this.isSupport &&
                        this.ws &&
                        this.ws.readyState === WebSocket.OPEN
                    ) {
                        clearTimeout(this.typingTimeout);

                        this.ws.send(JSON.stringify({ type: "typing" }));

                        this.typingTimeout = setTimeout(() => {
                            // Stop typing indicator after 2 seconds
                        }, 2000);
                    }
                }

                autoResizeTextarea() {
                    this.messageInput.style.height = "auto";
                    this.messageInput.style.height =
                        Math.min(this.messageInput.scrollHeight, 100) + "px";
                }

                updateStatus(connected) {
                    if (connected) {
                        this.statusIndicator.classList.add("connected");
                        this.statusText.textContent = "Connected";
                    } else {
                        this.statusIndicator.classList.remove("connected");
                        this.statusText.textContent = "Disconnected";
                    }
                }

                updateRoomInfo() {
                    if (this.roomId) {
                        this.roomInfo.textContent = `Room ID: ${this.roomId}`;
                        this.roomInfo.classList.remove("hidden");
                    }
                }

                showNotification(message, type = "success") {
                    const notification = document.createElement("div");
                    notification.className = `notification ${type}`;
                    notification.textContent = message;
                    document.body.appendChild(notification);

                    setTimeout(() => {
                        notification.remove();
                    }, 3000);
                }

                scrollToBottom() {
                    this.messagesContainer.scrollTop =
                        this.messagesContainer.scrollHeight;
                }
            }

            // Initialize chat app when page loads
            const chat = new ChatApp();
        </script>
    </body>
</html>
