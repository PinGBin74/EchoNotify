services:
  postgres:
    image: postgres:16-alpine
    restart: always
    shm_size: 128mb
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  echonotify:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=docker
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: always

  celery_worker:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    env_file:
      - .env
    environment:
      - ENVIRONMENT=docker
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: always
    command: >
      sh -c "
      /usr/local/bin/wait-for-it.sh postgres:5432 --timeout=30 -- echo 'Postgres is ready' &&
      /usr/local/bin/wait-for-it.sh redis:6379 --timeout=30 -- echo 'Redis is ready' &&
      celery -A echonotify.celery_app worker --loglevel=info
      "

  celery_beat:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    env_file:
      - .env
    environment:
      - ENVIRONMENT=docker
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: always
    command: >
      sh -c "
      /usr/local/bin/wait-for-it.sh postgres:5432 --timeout=30 -- echo 'Postgres is ready' &&
      /usr/local/bin/wait-for-it.sh redis:6379 --timeout=30 -- echo 'Redis is ready' &&
      celery -A echonotify.celery_app beat --loglevel=info
      "

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
