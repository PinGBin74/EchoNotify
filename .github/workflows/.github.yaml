name: CI

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*', 'fix/*']
  pull_request:
    branches: [main, develop, 'feature/*', 'hotfix/*', 'fix/*']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.13.1 and set up environment
        run: |
          uv python install 3.13.1
          uv python pin 3.13.1
          uv python update-shell

      - name: Install deps
        run: uv sync --locked --all-extras --dev

      - name: Black
        run: uv run black --check echonotify

      - name: Ruff
        run: uv run ruff check echonotify

      - name: Flake8
        run: uv run flake8 echonotify --count --show-source --statistics --ignore=E501,W503

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.13.1 and set up environment
        run: |
          uv python install 3.13.1
          uv python pin 3.13.1
          uv python update-shell

      - name: Install deps
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest
